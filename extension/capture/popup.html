<!doctype html><html lang="en"><head><meta charset="utf-8"><title>JobSync Capture</title><link rel="stylesheet" href="popup.css"></head><body>
<h1>JobSync Capture</h1>
<details id="settings"><summary>Connection settings</summary><p id="origin"></p><label>JobSync base URL<input id="base" placeholder="http://localhost:3737"></label><label>Pairing token<input id="token" type="password" autocomplete="off"></label><button id="connect">Save connection and grant origin access</button><button id="forget">Forget token</button></details>
<div class="row"><button id="capture">Capture visible page</button><button id="selection">Capture selected text</button></div>
<p id="status" role="status"></p><ul id="warnings"></ul>
<form id="preview"><label>Save as<select id="kind"><option value="person">Person</option><option value="job">Job</option></select></label><label>Name / job title<input id="name" required maxlength="200"></label><label>Company<input id="company" maxlength="200"></label><label>Headline<input id="headline" maxlength="300"></label><label>Location<input id="location" maxlength="200"></label><label>Profile / job URL<input id="url" type="url"></label><label>Notes / job description<textarea id="notes" rows="5"></textarea></label><label>Opportunity (last choice is shown explicitly)<select id="opportunity"><option value="">None</option></select></label><label>Opportunity role<select id="role"><option value="contact">Contact</option><option value="recruiter">Recruiter</option><option value="hiring-manager">Hiring manager</option><option value="referrer">Referrer</option></select></label><button id="save" type="submit">Save to JobSync</button></form>
<a id="record" hidden target="_blank" rel="noreferrer">Open saved record</a><script type="module" src="popup.js"></script></body></html>
